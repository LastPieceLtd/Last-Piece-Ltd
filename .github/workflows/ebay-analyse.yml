
name: Analyser les annonces LEGO sur eBay

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Nombre de references LEGO"
        required: true
        default: "20"
        type: string
      marketplace:
        description: "Marche eBay"
        required: true
        default: "EBAY_FR"
        type: choice
        options:
          - EBAY_FR
          - EBAY_DE
          - EBAY_GB
          - EBAY_US

jobs:
  analyse:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer les fichiers
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Analyser temporairement les annonces
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          LIMIT: ${{ inputs.limit }}
          MARKETPLACE: ${{ inputs.marketplace }}
        run: python scripts/analyze_ebay.py
