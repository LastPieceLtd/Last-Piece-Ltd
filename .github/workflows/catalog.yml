
name: Mettre à jour le catalogue LEGO

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Mettre à jour les données
        run: python scripts/update_catalog.py

      - name: Enregistrer le catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "Mise à jour automatique du catalogue LEGO"
            git push
          fi
